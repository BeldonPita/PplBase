<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dashboard-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .welcome { margin-bottom: 24px; }
        .welcome h1 { font-size: 28px; }
        .welcome p { color: var(--text-secondary); }
        .exp-item { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .exp-item .info h4 { font-size: 16px; color: var(--text-primary); }
        .exp-item .info p { color: var(--text-secondary); font-size: 14px; margin: 2px 0; }
        .exp-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
        .exp-actions button:hover { color: #EF4444; }
        .input-row { display: flex; gap: 8px; margin-top: 12px; }
        .input-row input { flex: 1; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); }
        .profile-info p { padding: 4px 0; border-bottom: 1px solid var(--border-color); }
        .profile-info p:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="inicio.html">Início</a>
                <a href="busca.html">Buscar</a>
                <a href="dashboard.html" class="active">Dashboard</a>
                <button class="btn btn-outline btn-small" id="btnLogout">Sair</button>
                <div class="theme-toggle" id="themeToggle">
                    <button class="toggle-option active" data-theme="dark">🌙</button>
                    <button class="toggle-option" data-theme="light">☀️</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome">
            <h1>Olá, <span id="userName">Usuário</span> 👋</h1>
            <p>Bem-vindo ao seu dashboard.</p>
        </div>

        <div class="card">
            <h3>👤 Meu Perfil</h3>
            <div class="profile-info" id="profileInfo"><div class="empty">Carregando...</div></div>
            <button class="btn btn-primary btn-small" id="btnEditarPerfil" style="margin-top:12px;">✏️ Editar Perfil</button>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>🧠 Habilidades</h3>
                <div id="habilidadesList"><div class="empty">Nenhuma habilidade</div></div>
                <div class="input-row">
                    <input type="text" id="novaHabilidade" placeholder="Ex: Python">
                    <button class="btn btn-primary btn-small" id="btnAddHabilidade">+</button>
                </div>
            </div>

            <div class="card">
                <h3>💼 Experiências</h3>
                <div id="experienciasList"><div class="empty">Nenhuma experiência</div></div>
                <button class="btn btn-primary btn-small" id="btnAddExperiencia" style="margin-top:12px; width:100%;">+ Adicionar</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR PERFIL -->
    <div class="modal" id="modalEditarPerfil">
        <div class="modal-content">
            <button class="modal-close" id="fecharModalEditar">&times;</button>
            <h2>✏️ Editar Perfil</h2>
            <form id="formEditarPerfil">
                <div class="form-group"><label>Nome</label><input type="text" id="editNome" required></div>
                <div class="form-group"><label>Bio</label><input type="text" id="editBio" placeholder="Sobre você..."></div>
                <div class="form-group"><label>Localização</label><input type="text" id="editLocalizacao" placeholder="Cidade, País"></div>
                <button type="submit" class="btn btn-primary btn-full">Salvar</button>
                <p class="form-message" id="editMessage"></p>
            </form>
        </div>
    </div>

    <!-- MODAL EXPERIÊNCIA -->
    <div class="modal" id="modalExperiencia">
        <div class="modal-content">
            <button class="modal-close" id="fecharModalExp">&times;</button>
            <h2 id="modalExpTitle">Adicionar Experiência</h2>
            <form id="formExperiencia">
                <input type="hidden" id="expId">
                <div class="form-group"><label>Título</label><input type="text" id="expTitulo" required></div>
                <div class="form-group"><label>Empresa</label><input type="text" id="expEmpresa"></div>
                <div class="form-group"><label>Descrição</label><input type="text" id="expDescricao"></div>
                <div class="form-group"><label>Localização</label><input type="text" id="expLocalizacao"></div>
                <button type="submit" class="btn btn-primary btn-full">Salvar</button>
                <p class="form-message" id="expMessage"></p>
            </form>
        </div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>
    <script src="dashboard.js"></script>
</body>
</html>
