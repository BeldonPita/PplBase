<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando - PplBase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0B0D15;
            color: #E4E6EB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 40px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .logo-avatar {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }
        .logo-svg {
            width: 100%;
            height: 100%;
            animation: girarLogo 1.2s linear infinite;
        }
        .logo-ring {
            fill: none;
            stroke: #8B5CF6;
            stroke-width: 2.5;
            opacity: 0.8;
        }
        .logo-ring-2 {
            stroke: #6D28D9;
            stroke-width: 2;
            stroke-dasharray: 4 8;
            animation: girarLogo 0.6s linear infinite reverse;
        }
        .logo-dot {
            fill: #8B5CF6;
            animation: pulsarDot 1s ease-in-out infinite;
        }
        .logo-dot:nth-child(3) { animation-delay: 0.25s; }
        .logo-dot:nth-child(4) { animation-delay: 0.5s; }
        .logo-dot:nth-child(5) { animation-delay: 0.75s; }
        .logo-letter {
            fill: #E4E6EB;
            font-size: 40px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #E4E6EB;
            letter-spacing: 2px;
        }
        .logo-text .highlight { color: #8B5CF6; }

        @keyframes girarLogo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulsarDot {
            0%, 100% { opacity: 0.2; r: 3; }
            50% { opacity: 1; r: 6; }
        }

        .progress-container {
            width: 280px;
            max-width: 80vw;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1A1D2E;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8B5CF6, #6D28D9, #8B5CF6);
            background-size: 200% 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-label {
            color: #A0A4B8;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .message {
            color: #5A5E72;
            font-size: 14px;
            animation: pulse-text 1.8s ease-in-out infinite;
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .message.erro {
            color: #F87171;
            animation: none;
        }
        .message.sucesso {
            color: #4ADE80;
            animation: none;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-avatar">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle class="logo-ring" cx="50" cy="50" r="42" />
                <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                <circle class="logo-dot" cx="50" cy="8" r="4" />
                <circle class="logo-dot" cx="50" cy="92" r="4" />
                <circle class="logo-dot" cx="8" cy="50" r="4" />
                <circle class="logo-dot" cx="92" cy="50" r="4" />
                <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
            </svg>
        </div>
        <span class="logo-text">Ppl<span class="highlight">Base</span></span>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">A conetar...</div>
    </div>

    <div class="message" id="statusMessage">Aguarde um momento</div>

    <script>
        // =========================================================
        // OBTER PARÂMETROS DA URL
        // =========================================================

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        const redirectUrl = getParam('redirect') || '/inicio.html';
        const action = getParam('action');
        const username = getParam('username');
        const senha = getParam('senha');
        const nome = getParam('nome');
        const email = getParam('email');
        const localizacao = getParam('localizacao');

        const API_URL = 'https://pplbase.onrender.com';
        let erroOcorreu = false;
        let mensagemErro = '';

        // =========================================================
        // ELEMENTOS
        // =========================================================

        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressLabel');
        const statusMsg = document.getElementById('statusMessage');

        const messages = [
            'A conetar ao servidor...',
            'A autenticar credenciais...',
            'A preparar o seu perfil...',
            'Quase lá...',
            'Bem-vindo ao PplBase! 🚀'
        ];

        const messagesErro = [
            'A conetar ao servidor...',
            'A autenticar credenciais...',
            '⚠️ A verificar dados...',
            '❌ Erro detectado',
            'A redirecionar...'
        ];

        let progress = 0;
        let isComplete = false;
        let isErro = false;

        function updateProgress() {
            if (isComplete) return;

            if (isErro) {
                // Modo de erro: barra vai até 100% e redireciona para o login
                if (progress < 100) {
                    const increment = progress < 50 ? 15 : 8;
                    progress = Math.min(progress + increment, 100);
                    fill.style.width = progress + '%';

                    const index = Math.min(Math.floor(progress / 20), messagesErro.length - 1);
                    label.textContent = messagesErro[index];

                    if (progress < 30) statusMsg.textContent = '⏳ A conetar...';
                    else if (progress < 60) statusMsg.textContent = '🔐 A verificar credenciais...';
                    else if (progress < 80) statusMsg.textContent = '⚠️ ' + mensagemErro;
                    else statusMsg.textContent = '❌ Erro, a redirecionar...';

                    setTimeout(updateProgress, 150);
                } else {
                    label.textContent = '❌ ' + mensagemErro;
                    statusMsg.className = 'message erro';
                    statusMsg.textContent = 'A redirecionar...';
                    setTimeout(() => {
                        window.location.href = '/login.html?erro=' + encodeURIComponent(mensagemErro);
                    }, 1500);
                }
                return;
            }

            // Modo normal (sucesso)
            if (progress < 100) {
                const increment = progress < 30 ? 12 :
                                  progress < 60 ? 8 :
                                  progress < 80 ? 5 : 3;
                progress = Math.min(progress + increment, 100);
                fill.style.width = progress + '%';

                const index = Math.min(Math.floor(progress / 20), messages.length - 1);
                label.textContent = messages[index];

                if (progress < 30) statusMsg.textContent = '⏳ A iniciar sessão...';
                else if (progress < 60) statusMsg.textContent = '🔐 A verificar credenciais...';
                else if (progress < 80) statusMsg.textContent = '📁 A carregar perfil...';
                else if (progress < 95) statusMsg.textContent = '⚡ A preparar o dashboard...';
                else statusMsg.textContent = '🎉 A entrar...';

                setTimeout(updateProgress, 120);
            } else {
                isComplete = true;
                label.textContent = '✅ Pronto!';
                statusMsg.className = 'message sucesso';
                statusMsg.textContent = action === 'login' ? '✅ Login realizado com sucesso!' : '✅ Conta criada com sucesso!';
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 800);
            }
        }

        // =========================================================
        // PROCESSAR AÇÃO
        // =========================================================

        if (action === 'login') {
            // LOGIN
            fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, senha })
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (ok && data.access_token) {
                    localStorage.setItem('pplbase_token', data.access_token);
                    // Sucesso -> animação normal
                    updateProgress();
                } else {
                    isErro = true;
                    mensagemErro = data.detail || 'Credenciais inválidas';
                    updateProgress();
                }
            })
            .catch(err => {
                isErro = true;
                mensagemErro = 'Erro de conexão com o servidor';
                updateProgress();
            });

        } else if (action === 'cadastro') {
            // CADASTRO
            const payload = { nome, username: getParam('username'), email, senha, localizacao };
            fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (ok && data.access_token) {
                    localStorage.setItem('pplbase_token', data.access_token);
                    // Sucesso -> animação normal
                    updateProgress();
                } else {
                    isErro = true;
                    mensagemErro = data.detail || 'Erro ao criar conta';
                    updateProgress();
                }
            })
            .catch(err => {
                isErro = true;
                mensagemErro = 'Erro de conexão com o servidor';
                updateProgress();
            });

        } else {
            // Redirecionamento normal (sem ação) -> só animação
            updateProgress();
        }
    </script>
</body>
</html>
