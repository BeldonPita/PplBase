<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando - PplBase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0B0D15;
            color: #E4E6EB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 40px;
        }

        /* ===== LOGO ANIMADA ===== */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .logo-avatar {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }
        .logo-svg {
            width: 100%;
            height: 100%;
            animation: girarLogo 1.2s linear infinite;
        }
        .logo-ring {
            fill: none;
            stroke: #8B5CF6;
            stroke-width: 2.5;
            opacity: 0.8;
        }
        .logo-ring-2 {
            stroke: #6D28D9;
            stroke-width: 2;
            stroke-dasharray: 4 8;
            animation: girarLogo 0.6s linear infinite reverse;
        }
        .logo-dot {
            fill: #8B5CF6;
            animation: pulsarDot 1s ease-in-out infinite;
        }
        .logo-dot:nth-child(3) { animation-delay: 0.25s; }
        .logo-dot:nth-child(4) { animation-delay: 0.5s; }
        .logo-dot:nth-child(5) { animation-delay: 0.75s; }
        .logo-letter {
            fill: #E4E6EB;
            font-size: 40px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #E4E6EB;
            letter-spacing: 2px;
        }
        .logo-text .highlight {
            color: #8B5CF6;
        }

        @keyframes girarLogo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulsarDot {
            0%, 100% { opacity: 0.2; r: 3; }
            50% { opacity: 1; r: 6; }
        }

        /* ===== BARRA DE PROGRESSO ===== */
        .progress-container {
            width: 280px;
            max-width: 80vw;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1A1D2E;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8B5CF6, #6D28D9, #8B5CF6);
            background-size: 200% 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-label {
            color: #A0A4B8;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ===== MENSAGEM ===== */
        .message {
            color: #5A5E72;
            font-size: 14px;
            animation: pulse-text 1.8s ease-in-out infinite;
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- LOGO ANIMADA -->
        <div class="logo-avatar">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle class="logo-ring" cx="50" cy="50" r="42" />
                <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                <circle class="logo-dot" cx="50" cy="8" r="4" />
                <circle class="logo-dot" cx="50" cy="92" r="4" />
                <circle class="logo-dot" cx="8" cy="50" r="4" />
                <circle class="logo-dot" cx="92" cy="50" r="4" />
                <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
            </svg>
        </div>
        <span class="logo-text">Ppl<span class="highlight">Base</span></span>
    </div>

    <!-- BARRA DE PROGRESSO -->
    <div class="progress-container">
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">A conetar...</div>
    </div>

    <div class="message" id="statusMessage">Aguarde um momento</div>

    <script>
        // =========================================================
        // ANIMAÇÃO DA BARRA DE PROGRESSO
        // =========================================================

        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressLabel');
        const statusMsg = document.getElementById('statusMessage');

        // Textos dinâmicos
        const messages = [
            'A conetar ao servidor...',
            'A autenticar credenciais...',
            'A preparar o seu perfil...',
            'Quase lá...',
            'Bem-vindo ao PplBase! 🚀'
        ];

        let progress = 0;
        let step = 0;

        function updateProgress() {
            if (progress < 100) {
                // Avançar de forma dinâmica (mais rápido no início, mais lento no fim)
                const increment = progress < 30 ? 12 :
                                  progress < 60 ? 8 :
                                  progress < 80 ? 5 : 3;
                progress = Math.min(progress + increment, 100);
                fill.style.width = progress + '%';

                // Atualizar texto com base no progresso
                const index = Math.min(Math.floor(progress / 20), messages.length - 1);
                label.textContent = messages[index];

                // Mensagem adicional
                if (progress < 30) statusMsg.textContent = '⏳ A iniciar sessão...';
                else if (progress < 60) statusMsg.textContent = '🔐 A verificar credenciais...';
                else if (progress < 80) statusMsg.textContent = '📁 A carregar perfil...';
                else if (progress < 95) statusMsg.textContent = '⚡ A preparar o dashboard...';
                else statusMsg.textContent = '🎉 A entrar...';

                setTimeout(updateProgress, 120);
            } else {
                label.textContent = '✅ Pronto!';
                statusMsg.textContent = 'A redirecionar...';
                // Redirecionar após concluir
                const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/inicio.html';
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 600);
            }
        }

        // Iniciar a animação
        updateProgress();
    </script>
</body>
</html>
