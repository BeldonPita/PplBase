
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Talentos - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .search-section { padding: 40px 0; }
        
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto 16px;
            flex-wrap: wrap;
        }
        
        .search-box input {
            flex: 2;
            padding: 14px 20px;
            background: #0b0d15;
            border: 2px solid #1a1d2e;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
            min-width: 180px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        
        .search-box select {
            padding: 14px 20px;
            background: #0b0d15;
            border: 2px solid #1a1d2e;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            min-width: 140px;
            cursor: pointer;
        }
        
        .search-box select:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        
        .search-box button {
            padding: 14px 30px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }
        
        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 20px;
        }
        
        .filter-row .filter-tag {
            background: #1a1d2e;
            padding: 6px 16px;
            border-radius: 20px;
            color: #a0a4b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .filter-row .filter-tag:hover {
            border-color: #8b5cf6;
            color: #fff;
        }
        
        .filter-row .filter-tag.active {
            background: #8b5cf6;
            color: #fff;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        
        .user-card {
            background: #161926;
            border: 1px solid #1a1d2e;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
            text-align: center;
        }
        
        .user-card:hover {
            border-color: #8b5cf6;
            transform: translateY(-4px);
        }
        
        .user-card .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
        }
        
        .user-card h3 { color: #fff; margin-bottom: 4px; }
        .user-card .username { color: #8b5cf6; font-size: 14px; font-weight: 500; }
        .user-card .location { color: #a0a4b8; font-size: 13px; margin: 6px 0; }
        .user-card .bio { color: #a0a4b8; font-size: 14px; margin: 10px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .user-card .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
        .user-card .tags .tag { background: #1a1d2e; color: #8b5cf6; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .user-card .btn-view { margin-top: 14px; padding: 8px 24px; background: transparent; border: 1px solid #8b5cf6; color: #8b5cf6; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: 500; font-size: 14px; text-decoration: none; display: inline-block; }
        .user-card .btn-view:hover { background: #8b5cf6; color: #fff; }
        
        .empty-state { text-align: center; padding: 60px 0; color: #5a5e72; }
        .empty-state .big-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state h3 { color: #fff; margin-bottom: 8px; }
        .loading { text-align: center; padding: 40px 0; color: #a0a4b8; }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }
        
        .pagination button {
            padding: 8px 16px;
            background: #1a1d2e;
            border: 1px solid #1a1d2e;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pagination button:hover {
            border-color: #8b5cf6;
        }
        
        .pagination button.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }
        
        .result-count {
            text-align: center;
            color: #a0a4b8;
            font-size: 14px;
            margin-top: 8px;
        }
        
        @media (max-width: 640px) {
            .search-box { flex-direction: column; }
            .search-box input, .search-box select, .search-box button { width: 100%; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
           <div class="nav-links">
    <a href="inicio.html">Início</a>
    <a href="busca.html">🔍 Buscar</a>
    <a href="dashboard.html">Dashboard</a>
    <button class="btn btn-outline" id="btnLogout">Sair</button>
</div>
        </div>
    </nav>

    <section class="search-section">
        <div class="container">
            <h1 style="text-align: center; font-size: 32px; margin-bottom: 8px;">
                🔍 Encontre <span class="highlight">talentos</span>
            </h1>
            <p style="text-align: center; color: #a0a4b8; margin-bottom: 30px;">
                Busque pessoas por habilidade, localização ou nome
            </p>

            <!-- Busca -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="O que você procura? Ex: Python, Design..." />
                <select id="searchHabilidade">
                    <option value="">Todas as habilidades</option>
                </select>
                <select id="searchLocalizacao">
                    <option value="">Todas as localizações</option>
                </select>
                <select id="searchOrdenar">
                    <option value="nome">Ordenar por: Nome</option>
                    <option value="recente">Ordenar por: Mais recentes</option>
                    <option value="localizacao">Ordenar por: Localização</option>
                </select>
                <button id="btnBuscar">🔍 Buscar</button>
            </div>

            <!-- Filtros rápidos -->
            <div class="filter-row" id="filterRow">
                <span class="filter-tag active" data-filter="all">Todos</span>
                <span class="filter-tag" data-filter="python">🐍 Python</span>
                <span class="filter-tag" data-filter="javascript">🟨 JavaScript</span>
                <span class="filter-tag" data-filter="design">🎨 Design</span>
                <span class="filter-tag" data-filter="marketing">📊 Marketing</span>
                <span class="filter-tag" data-filter="gerencia">📋 Gerência</span>
            </div>

            <div id="resultCount" class="result-count"></div>

            <!-- Resultados -->
            <div id="resultsContainer">
                <div class="loading">🔍 Digite algo para buscar...</div>
            </div>

            <!-- Paginação -->
            <div class="pagination" id="pagination"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 PplBase - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="busca.js"></script>
</body>
</html>
