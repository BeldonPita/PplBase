<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="inicio.html">Início</a>
                <a href="busca.html" class="active">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="btn btn-outline btn-small" id="btnLogout">Sair</button>
            </div>
        </div>
    </nav>

    <div style="max-width:800px; margin:30px auto; padding:0 20px;">
        <h1 style="margin-bottom:20px;">Buscar Pessoas</h1>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
            <input type="text" id="searchInput" placeholder="Digite um nome, habilidade ou localização..." style="flex:1; padding:12px 16px; background:var(--input-bg); border:2px solid var(--border-color); border-radius:8px; color:var(--text-primary); font-size:16px;">
            <button class="btn btn-primary" id="btnBuscar">Buscar</button>
        </div>
        <div id="resultsContainer"><div class="empty">Digite algo para buscar</div></div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>
    <script src="busca.js"></script>
</body>
</html>
