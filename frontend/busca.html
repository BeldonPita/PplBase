<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .busca-container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .filtros-categorias {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .filtros-categorias label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
        }
        .filtros-categorias input[type="checkbox"] {
            accent-color: var(--color-primary);
            width: 16px;
            height: 16px;
        }
        .input-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .input-row input { flex: 1; padding: 12px 16px; background: var(--input-bg); border: 2px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 16px; min-width: 200px; }
        .result-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .result-item h3 { margin-bottom: 4px; }
        .result-item p { color: var(--text-secondary); font-size: 14px; }
        .result-item .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .result-item .tag { background: var(--bg-primary); padding: 2px 10px; border-radius: 12px; font-size: 12px; color: var(--color-primary); border: 1px solid var(--border-color); }
        .empty { color: var(--text-muted); text-align: center; padding: 40px 0; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="inicio.html">Início</a>
                <a href="busca.html" class="active">Buscar</a>
                <button class="btn btn-outline btn-small" id="btnLogout">Sair</button>
            </div>
        </div>
    </nav>

    <!-- MENU 3 BARRAS -->
    <div class="side-menu" id="sideMenu">
        <button class="menu-icon" id="menuToggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <button id="menuDashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Dashboard</button>
            <button id="menuAtividades"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> Atividades</button>
            <div class="divider"></div>
            <button id="menuDarkMode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode</button>
            <button id="menuLightMode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> Light Mode</button>
        </div>
    </div>

    <div class="busca-container">
        <h1>🔍 Buscar Pessoas</h1>
        <p style="color:var(--text-secondary);">Filtre por nome, habilidade ou categoria.</p>

        <div class="filtros-categorias">
            <label><input type="checkbox" checked> Vida Local</label>
            <label><input type="checkbox" checked> Educação</label>
            <label><input type="checkbox" checked> Trabalho</label>
            <label><input type="checkbox" checked> Tecnologia</label>
            <label><input type="checkbox" checked> Desenvolvimento</label>
        </div>

        <div class="input-row">
            <input type="text" id="searchInput" placeholder="Digite um nome, habilidade ou localização...">
            <button class="btn btn-primary" id="btnBuscar">Buscar</button>
        </div>

        <div id="resultsContainer"><div class="empty">Digite algo para buscar</div></div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <script>
        // ===== MENU 3 BARRAS =====
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('menuDropdown').classList.toggle('active');
        });
        document.getElementById('menuDashboard').addEventListener('click', () => {
            window.location.href = '/dashboard.html';
        });
        document.getElementById('menuAtividades').addEventListener('click', () => {
            window.location.href = '/inicio.html';
        });
        document.getElementById('menuDarkMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('menuDropdown').classList.remove('active');
        });
        document.getElementById('menuLightMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            document.getElementById('menuDropdown').classList.remove('active');
        });

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('pplbase_token');
            window.location.href = '/';
        });
    </script>
    <script src="busca.js"></script>
</body>
</html>
