<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .busca-container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .input-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            background: #0B0D15;
            border: 2px solid #1A1D2E;
            border-radius: 8px;
            color: #E4E6EB;
            font-size: 16px;
            min-width: 200px;
        }
        .input-row input:focus { outline: none; border-color: #8B5CF6; }
        .btn-primary {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(139,92,246,0.4); }
        .result-item {
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .result-item h3 { margin-bottom: 4px; }
        .result-item p { color: #A0A4B8; font-size: 14px; }
        .result-item .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .result-item .tag {
            background: #0B0D15;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #8B5CF6;
            border: 1px solid #1A1D2E;
        }
        .empty { color: #5A5E72; text-align: center; padding: 40px 0; }

        /* ===== NAVBAR ===== */
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #A0A4B8;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #E4E6EB;
            background: #1A1D2E;
        }
        .notification-icon {
            position: relative;
            cursor: pointer;
            padding: 8px;
            color: #A0A4B8;
            transition: all 0.2s;
        }
        .notification-icon:hover { color: #8B5CF6; }
        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #EF4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-outline {
            background: transparent;
            color: #A0A4B8;
            border: 2px solid #2A2D3E;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            border-color: #8B5CF6;
            color: #fff;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #E4E6EB;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        .nav-links.mobile {
            display: none;
            flex-direction: column;
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 16px;
            position: absolute;
            top: 60px;
            right: 0;
            z-index: 100;
            min-width: 180px;
            width: 100%;
            max-width: 280px;
        }
        .nav-links.mobile.open { display: flex; }
        .nav-links.mobile a { padding: 10px 12px; }
        .nav-links.mobile .btn-outline { width: 100%; text-align: center; margin-top: 8px; }

        @media (max-width: 768px) {
            .nav-links.desktop { display: none; }
            .menu-toggle { display: block; }
            .nav-links.mobile { max-width: 100%; right: 0; top: 60px; }
            .busca-container { padding: 0 12px; margin: 16px auto; }
        }
        @media (max-width: 480px) {
            .input-row input { font-size: 14px; padding: 10px 14px; }
            .btn-primary { padding: 10px 18px; font-size: 14px; }
            .logo-text { font-size: 18px; }
            .logo-avatar { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="nav-links desktop">
                <a href="inicio.html">Início</a>
                <a href="busca.html" class="active">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <div class="notification-icon" id="notifIcon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-badge">3</span>
                </div>
                <button class="btn-outline" id="btnLogoutDesktop">Sair</button>
            </div>
            <div class="nav-links mobile" id="mobileMenu">
                <a href="inicio.html">Início</a>
                <a href="busca.html" class="active">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="btn-outline" id="btnLogoutMobile">Sair</button>
            </div>
        </div>
    </nav>

    <!-- ===== CONTEÚDO ===== -->
    <div class="busca-container">
        <h1 style="margin-bottom:20px;">🔍 Buscar Pessoas</h1>
        <div class="input-row">
            <input type="text" id="searchInput" placeholder="Digite um nome, habilidade ou localização...">
            <button class="btn-primary" id="btnBuscar">Buscar</button>
        </div>
        <div id="resultsContainer"><div class="empty">Digite algo para buscar</div></div>
    </div>

    <footer style="padding:40px 0; text-align:center; border-top:1px solid #1A1D2E; color:#5A5E72;">
        <div class="container"><p>&copy; 2026 PplBase</p></div>
    </footer>

    <script>
        // ===== MENU MOBILE =====
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('open');
        });

        // ===== LOGOUT =====
        function logout() {
            localStorage.removeItem('pplbase_token');
            window.location.href = '/';
        }
        document.getElementById('btnLogoutDesktop').addEventListener('click', logout);
        document.getElementById('btnLogoutMobile').addEventListener('click', logout);

        // ===== BUSCA =====
        const API_URL = 'https://pplbase.onrender.com';
        const token = localStorage.getItem('pplbase_token');
        if (!token) window.location.href = '/';

        document.getElementById('btnBuscar').addEventListener('click', async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div style="text-align:center; color:#A0A4B8; padding:20px;">Buscando...</div>';
            try {
                const response = await fetch(`${API_URL}/pesquisa/pessoas?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Erro');
                const data = await response.json();
                if (!data.length) {
                    container.innerHTML = '<div class="empty">Nenhum resultado encontrado.</div>';
                    return;
                }
                container.innerHTML = data.map(p => `
                    <div class="result-item">
                        <h3>${p.nome || 'Usuário'}</h3>
                        <p>@${p.username} ${p.localizacao ? `📍 ${p.localizacao}` : ''}</p>
                        <p>${p.bio || 'Sem bio'}</p>
                        ${p.habilidades?.length ? `<div class="tags">${p.habilidades.map(h => `<span class="tag">${h.nome}</span>`).join('')}</div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="empty">Erro ao buscar.</div>';
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btnBuscar').click();
        });
    </script>
</body>
</html>
