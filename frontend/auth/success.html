<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação - PplBase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-avatar { width: 48px; height: 48px; flex-shrink: 0; }
        .logo-svg { width: 100%; height: 100%; animation: girarLogo 8s linear infinite; }
        .logo-ring { fill: none; stroke: var(--cor-primaria); stroke-width: 2; opacity: 0.7; }
        .logo-ring-2 { stroke: var(--cor-secundaria); stroke-width: 1.5; stroke-dasharray: 4 8; animation: girarLogo 4s linear infinite reverse; }
        .logo-dot { fill: var(--cor-primaria); animation: pulsarDot 2s ease-in-out infinite; }
        .logo-dot:nth-child(3) { animation-delay: 0.5s; }
        .logo-dot:nth-child(4) { animation-delay: 1s; }
        .logo-dot:nth-child(5) { animation-delay: 1.5s; }
        .logo-letter { fill: var(--cor-texto); font-size: 32px; font-weight: 700; font-family: 'Inter', sans-serif; text-anchor: middle; dominant-baseline: central; }
        .logo-text { font-size: 28px; font-weight: 800; color: var(--cor-texto); }
        .logo-text .highlight { color: var(--cor-primaria); }
        @keyframes girarLogo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulsarDot { 0%, 100% { opacity: 0.3; r: 3; } 50% { opacity: 1; r: 5; } }
        .message { color: var(--cor-texto-secundario); font-size: 16px; }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="logo">
        <div class="logo-avatar">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle class="logo-ring" cx="50" cy="50" r="42" />
                <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                <circle class="logo-dot" cx="50" cy="8" r="4" />
                <circle class="logo-dot" cx="50" cy="92" r="4" />
                <circle class="logo-dot" cx="8" cy="50" r="4" />
                <circle class="logo-dot" cx="92" cy="50" r="4" />
                <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
            </svg>
        </div>
        <span class="logo-text">Ppl<span class="highlight">Base</span></span>
    </div>
    <div class="message loading">A autenticar com Google...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('pplbase_token', token);
            setTimeout(() => { window.location.href = '/inicio.html'; }, 1000);
        } else {
            setTimeout(() => { window.location.href = '/login.html?erro=Login com Google falhou'; }, 2000);
        }
    </script>
<script src="tema.js"></script>
</body>
</html>
