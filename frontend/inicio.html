<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-inicio { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* ===== NAVBAR ===== */
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #A0A4B8;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #E4E6EB;
            background: #1A1D2E;
        }
        .notification-icon {
            position: relative;
            cursor: pointer;
            padding: 8px;
            color: #A0A4B8;
            transition: all 0.2s;
        }
        .notification-icon:hover { color: #8B5CF6; }
        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #EF4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-outline {
            background: transparent;
            color: #A0A4B8;
            border: 2px solid #2A2D3E;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            border-color: #8B5CF6;
            color: #fff;
        }

        /* ===== MENU 3 BARRAS ===== */
        .side-menu {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        .side-menu .menu-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s;
        }
        .side-menu .menu-icon:hover { transform: scale(1.05); }
        .side-menu .menu-dropdown {
            position: absolute;
            bottom: 60px;
            left: 0;
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 8px;
            min-width: 160px;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .side-menu .menu-dropdown.active { display: block; }
        .side-menu .menu-dropdown button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #E4E6EB;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-menu .menu-dropdown button:hover { background: #1A1D2E; }
        .side-menu .menu-dropdown .divider { height: 1px; background: #1A1D2E; margin: 6px 0; }

        /* ===== BANNER ===== */
        .banner {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border-radius: 16px;
            padding: 30px;
            color: #fff;
            margin-bottom: 30px;
        }
        .banner h1 { font-size: 28px; margin-bottom: 4px; }
        .banner p { opacity: 0.9; }

        /* ===== RESPONSIVO ===== */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #E4E6EB;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        .nav-links.mobile {
            display: none;
            flex-direction: column;
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 16px;
            position: absolute;
            top: 60px;
            right: 0;
            z-index: 100;
            min-width: 180px;
            width: 100%;
            max-width: 280px;
        }
        .nav-links.mobile.open { display: flex; }
        .nav-links.mobile a { padding: 10px 12px; }
        .nav-links.mobile .btn-outline { width: 100%; text-align: center; margin-top: 8px; }

        @media (max-width: 768px) {
            .nav-links.desktop { display: none; }
            .menu-toggle { display: block; }
            .nav-links.mobile { max-width: 100%; right: 0; top: 60px; }
            .banner h1 { font-size: 22px; }
            .banner { padding: 20px; }
        }
        @media (max-width: 480px) {
            .banner h1 { font-size: 18px; }
            .container-inicio { padding: 12px; }
            .logo-text { font-size: 18px; }
            .logo-avatar { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="nav-links desktop">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <div class="notification-icon" id="notifIcon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-badge">3</span>
                </div>
                <button class="btn-outline" id="btnLogoutDesktop">Sair</button>
            </div>
            <div class="nav-links mobile" id="mobileMenu">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="btn-outline" id="btnLogoutMobile">Sair</button>
            </div>
        </div>
    </nav>

    <!-- ===== MENU 3 BARRAS ===== -->
    <div class="side-menu" id="sideMenu">
        <button class="menu-icon" id="menuToggleSide">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <button id="menuDashboard">📊 Dashboard</button>
            <button id="menuAtividades">📰 Atividades</button>
            <div class="divider"></div>
            <button id="menuDarkMode">🌙 Dark Mode</button>
            <button id="menuLightMode">☀️ Light Mode</button>
        </div>
    </div>

    <!-- ===== CONTEÚDO ===== -->
    <div class="container-inicio">
        <div class="banner">
            <h1>👋 Bem-vindo de volta, <span id="userName">Usuário</span>!</h1>
            <p>Explore as últimas novidades e conecte-se com a comunidade.</p>
        </div>
        <div id="feedContent" style="color:#A0A4B8; text-align:center; padding:40px 0;">
            Carregando atividades...
        </div>
    </div>

    <footer style="padding:40px 0; text-align:center; border-top:1px solid #1A1D2E; color:#5A5E72;">
        <div class="container"><p>&copy; 2026 PplBase</p></div>
    </footer>

    <script>
        // ===== MENU MOBILE =====
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('open');
        });

        // ===== MENU 3 BARRAS =====
        document.getElementById('menuToggleSide').addEventListener('click', () => {
            document.getElementById('menuDropdown').classList.toggle('active');
        });
        document.getElementById('menuDashboard').addEventListener('click', () => {
            window.location.href = '/dashboard.html';
        });
        document.getElementById('menuAtividades').addEventListener('click', () => {
            window.location.href = '/inicio.html';
        });
        document.getElementById('menuDarkMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('menuDropdown').classList.remove('active');
        });
        document.getElementById('menuLightMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            document.getElementById('menuDropdown').classList.remove('active');
        });

        // ===== LOGOUT =====
        function logout() {
            localStorage.removeItem('pplbase_token');
            window.location.href = '/';
        }
        document.getElementById('btnLogoutDesktop').addEventListener('click', logout);
        document.getElementById('btnLogoutMobile').addEventListener('click', logout);

        // ===== CARREGAR FEED =====
        const API_URL = 'https://pplbase.onrender.com';
        const token = localStorage.getItem('pplbase_token');
        if (!token) window.location.href = '/';

        async function carregarFeed() {
            try {
                const response = await fetch(`${API_URL}/pesquisa/pessoas`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Erro');
                const pessoas = await response.json();
                const container = document.getElementById('feedContent');
                if (!pessoas.length) {
                    container.innerHTML = '<div style="text-align:center; color:#5A5E72; padding:20px;">Nenhuma atividade recente.</div>';
                    return;
                }
                container.innerHTML = pessoas.slice(0, 5).map(p => `
                    <div style="background:#161926; border:1px solid #1A1D2E; border-radius:12px; padding:16px; margin-bottom:12px;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#8B5CF6,#6D28D9); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;">${p.nome?.charAt(0) || '?'}</div>
                            <div>
                                <div style="font-weight:600;">${p.nome || 'Usuário'}</div>
                                <div style="color:#5A5E72; font-size:13px;">@${p.username}</div>
                            </div>
                        </div>
                        <div style="margin-top:8px; color:#A0A4B8;">${p.bio || 'Novo membro do PplBase!'}</div>
                        ${p.localizacao ? `<div style="color:#5A5E72; font-size:12px; margin-top:4px;">📍 ${p.localizacao}</div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('feedContent').innerHTML = '<div style="text-align:center; color:#EF4444; padding:20px;">Erro ao carregar feed.</div>';
            }
        }
        carregarFeed();
    </script>
</body>
</html>
