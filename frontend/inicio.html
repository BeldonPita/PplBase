<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .container-inicio { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .banner {
            background: var(--cor-primaria);
            background-image: none;
            border-radius: 16px;
            padding: 40px;
            color: #fff;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .banner .banner-content { flex: 1; min-width: 250px; }
        .banner h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #fff;
        }
        .banner p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            max-width: 600px;
        }
        .banner .banner-cta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .banner .banner-cta a,
        .banner .banner-cta button {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .banner .banner-cta a:hover,
        .banner .banner-cta button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .banner .banner-icon {
            font-size: 64px;
            opacity: 0.3;
            flex-shrink: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--cor-cartao);
            border: 1px solid var(--cor-borda);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--cor-primaria);
        }
        .stat-card .label {
            color: var(--cor-texto-secundario);
            font-size: 14px;
        }

        .sugestoes, .atividades {
            background: var(--cor-cartao);
            border: 1px solid var(--cor-borda);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .sugestoes h3, .atividades h3 {
            color: var(--cor-texto);
            margin-bottom: 16px;
        }

        .sugestao-item, .atividade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--cor-borda);
            gap: 12px;
        }
        .sugestao-item:last-child, .atividade-item:last-child {
            border-bottom: none;
        }
        .sugestao-item .info, .atividade-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .sugestao-item .avatar, .atividade-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--cor-primaria);
            background-image: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            flex-shrink: 0;
        }
        .sugestao-item .nome, .atividade-item .nome {
            color: var(--cor-texto);
            font-weight: 600;
        }
        .sugestao-item .username, .atividade-item .username {
            color: var(--cor-texto-secundario);
            font-size: 13px;
        }
        .btn-seguir {
            padding: 6px 16px;
            background: var(--cor-primaria);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .btn-seguir:hover {
            background: var(--cor-secundaria);
            transform: scale(1.05);
        }
        .empty {
            color: var(--cor-texto-secundario);
            text-align: center;
            padding: 20px 0;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .banner { padding: 24px; }
            .banner h1 { font-size: 22px; }
            .banner .banner-icon { display: none; }
            .sugestao-item { flex-wrap: wrap; }
            .btn-seguir { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <a href="dashboard.html">Dashboard</a>
                <button class="btn btn-outline btn-small" id="btnLogout">Sair</button>
                <button class="toggle-tema" aria-label="Alternar tema"></button>
            </div>
        </div>
    </nav>

    <div class="container-inicio">
        <!-- ===== BANNER DINÂMICO ===== -->
        <div class="banner" id="banner">
            <div class="banner-content">
                <h1 id="bannerTitulo">Bem-vindo, <span id="userName">Usuário</span>!</h1>
                <p id="bannerMensagem">Explore as últimas novidades e conecte-se com a comunidade.</p>
                <div class="banner-cta" id="bannerCta" style="display:none;">
                    <a href="dashboard.html">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Completar Perfil
                    </a>
                    <a href="busca.html">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        Encontrar Talentos
                    </a>
                </div>
            </div>
            <div class="banner-icon" id="bannerIcon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
        </div>

        <!-- ===== ESTATÍSTICAS ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="statSeguidores">0</div>
                <div class="label">Seguidores</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statSeguindo">0</div>
                <div class="label">Seguindo</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statHabilidades">0</div>
                <div class="label">Habilidades</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statExperiencias">0</div>
                <div class="label">Experiências</div>
            </div>
        </div>

        <!-- ===== SUGESTÕES ===== -->
        <div class="sugestoes">
            <h3>Pessoas para seguir</h3>
            <div id="sugestoesContainer">
                <div class="empty">Carregando...</div>
            </div>
        </div>

        <!-- ===== ATIVIDADES ===== -->
        <div class="atividades">
            <h3>Últimas atividades</h3>
            <div id="atividadesContainer">
                <div class="empty">Carregando...</div>
            </div>
        </div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <script src="tema.js"></script>
    <script src="inicio.js"></script>
</body>
</html>
