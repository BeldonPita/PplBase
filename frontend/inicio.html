<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .feed-container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .feed-item { background: #161926; border: 1px solid #1A1D2E; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .feed-item .user { display: flex; align-items: center; gap: 12px; }
        .feed-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8B5CF6, #6D28D9); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
        .feed-item .content { margin-top: 8px; color: #A0A4B8; }
        .feed-item .time { color: #5A5E72; font-size: 12px; margin-top: 4px; }
        .empty { color: #5A5E72; text-align: center; padding: 40px 0; }

        .side-menu {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        .side-menu .menu-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s;
        }
        .side-menu .menu-icon:hover { transform: scale(1.05); }
        .side-menu .menu-dropdown {
            position: absolute;
            bottom: 60px;
            left: 0;
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 8px;
            min-width: 160px;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .side-menu .menu-dropdown.active { display: block; }
        .side-menu .menu-dropdown button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #E4E6EB;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-menu .menu-dropdown button:hover { background: #1A1D2E; }
        .side-menu .menu-dropdown .divider { height: 1px; background: #1A1D2E; margin: 6px 0; }

        /* ===== NAVBAR ===== */
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links a {
            color: #A0A4B8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #E4E6EB;
            background: #1A1D2E;
        }
        .btn-small { padding: 6px 16px; font-size: 13px; border-radius: 6px; }
        .btn-outline { background: transparent; color: #A0A4B8; border: 2px solid #2A2D3E; }
        .btn-outline:hover { border-color: #8B5CF6; color: #fff; }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <button class="btn btn-outline btn-small" id="btnLogout">Sair</button>
            </div>
        </div>
    </nav>

    <!-- ===== MENU 3 BARRAS ===== -->
    <div class="side-menu" id="sideMenu">
        <button class="menu-icon" id="menuToggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <button id="menuDashboard">📊 Dashboard</button>
            <button id="menuAtividades">📰 Atividades</button>
            <div class="divider"></div>
            <button id="menuDarkMode">🌙 Dark Mode</button>
            <button id="menuLightMode">☀️ Light Mode</button>
        </div>
    </div>

    <!-- ===== FEED ===== -->
    <div class="feed-container">
        <h1 style="margin-bottom:20px;">Atividades Recentes</h1>
        <div id="feedContent"><div class="empty">Carregando...</div></div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <script>
        // ===== MENU 3 BARRAS =====
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('menuDropdown').classList.toggle('active');
        });

        document.getElementById('menuDashboard').addEventListener('click', () => {
            window.location.href = '/dashboard.html';
        });

        document.getElementById('menuAtividades').addEventListener('click', () => {
            window.location.href = '/inicio.html';
        });

        document.getElementById('menuDarkMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('menuDropdown').classList.remove('active');
        });

        document.getElementById('menuLightMode').addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            document.getElementById('menuDropdown').classList.remove('active');
        });

        // ===== TEMA =====
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // ===== LOGOUT =====
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('pplbase_token');
            window.location.href = '/';
        });

        // ===== CARREGAR FEED =====
        const API_URL = 'https://pplbase.onrender.com';
        const token = localStorage.getItem('pplbase_token');

        if (!token) window.location.href = '/';

        async function carregarFeed() {
            try {
                const response = await fetch(`${API_URL}/pesquisa/pessoas`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Erro');
                const pessoas = await response.json();
                const container = document.getElementById('feedContent');

                if (!pessoas.length) {
                    container.innerHTML = '<div class="empty">Nenhuma atividade recente.</div>';
                    return;
                }

                container.innerHTML = pessoas.slice(0, 10).map(p => `
                    <div class="feed-item">
                        <div class="user">
                            <div class="avatar">${p.nome?.charAt(0) || '?'}</div>
                            <div><strong>${p.nome || 'Usuário'}</strong> <span style="color:#5A5E72;">@${p.username}</span></div>
                        </div>
                        <div class="content">${p.bio || 'Novo membro do PplBase!'}</div>
                        <div class="time">${p.localizacao ? `📍 ${p.localizacao}` : ''}</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('feedContent').innerHTML = '<div class="empty">Erro ao carregar feed.</div>';
            }
        }

        carregarFeed();
    </script>

</body>
</html>
