<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - PplBase</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== GERAL ===== */
        .container-inicio { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* ===== BANNER ===== */
        .banner {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border-radius: 16px;
            padding: 40px;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
        }
        .banner h1 { font-size: 32px; margin-bottom: 8px; }
        .banner p { opacity: 0.9; font-size: 16px; }

        /* ===== ESTATÍSTICAS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 28px; font-weight: 700; color: #8B5CF6; }
        .stat-card .label { color: #A0A4B8; font-size: 14px; }

        /* ===== SUGESTÕES ===== */
        .sugestoes {
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .sugestoes h3 { margin-bottom: 16px; }
        .sugestao-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1A1D2E;
        }
        .sugestao-item:last-child { border-bottom: none; }
        .sugestao-item .info { display: flex; align-items: center; gap: 12px; }
        .sugestao-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }
        .sugestao-item .nome { font-weight: 600; }
        .sugestao-item .username { color: #A0A4B8; font-size: 13px; }
        .btn-seguir {
            padding: 6px 16px;
            background: #8B5CF6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-seguir:hover { background: #6D28D9; transform: scale(1.05); }

        /* ===== ATIVIDADES ===== */
        .atividades {
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 20px;
        }
        .atividades h3 { margin-bottom: 16px; }
        .atividade-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #1A1D2E;
        }
        .atividade-item:last-child { border-bottom: none; }
        .atividade-item .icon { font-size: 20px; }
        .atividade-item .text { color: #A0A4B8; font-size: 14px; }
        .atividade-item .text strong { color: #E4E6EB; }

        /* ===== MENU MOBILE ===== */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #E4E6EB;
            font-size: 24px;
            cursor: pointer;
        }
        .nav-links.mobile {
            display: none;
            flex-direction: column;
            background: #161926;
            border: 1px solid #1A1D2E;
            border-radius: 12px;
            padding: 16px;
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 100;
            min-width: 150px;
        }
        .nav-links.mobile.open { display: flex; }
        .nav-links.mobile a {
            padding: 8px 0;
            color: #A0A4B8;
            text-decoration: none;
        }
        .nav-links.mobile a:hover { color: #8B5CF6; }
        .nav-links.mobile button {
            margin-top: 8px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .nav-links.desktop { display: none; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .banner h1 { font-size: 24px; }
            .banner { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="nav-links desktop">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <button class="btn btn-outline btn-small" id="btnLogoutDesktop">Sair</button>
            </div>
            <div class="nav-links mobile" id="mobileMenu">
                <a href="inicio.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <button class="btn btn-outline btn-small" id="btnLogoutMobile">Sair</button>
            </div>
        </div>
    </nav>

    <!-- ===== CONTEÚDO ===== -->
    <div class="container-inicio">
        <!-- BANNER -->
        <div class="banner">
            <h1>👋 Bem-vindo de volta, <span id="userName">Usuário</span>!</h1>
            <p>Explore as últimas novidades e conecte-se com a comunidade.</p>
        </div>

        <!-- ESTATÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="statSeguidores">0</div>
                <div class="label">Seguidores</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statSeguindo">0</div>
                <div class="label">Seguindo</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statHabilidades">0</div>
                <div class="label">Habilidades</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statExperiencias">0</div>
                <div class="label">Experiências</div>
            </div>
        </div>

        <!-- SUGESTÕES -->
        <div class="sugestoes">
            <h3>🚀 Pessoas para seguir</h3>
            <div id="sugestoesContainer">
                <div style="text-align:center; color:#5A5E72; padding:20px;">Carregando...</div>
            </div>
        </div>

        <!-- ATIVIDADES -->
        <div class="atividades">
            <h3>📰 Últimas atividades</h3>
            <div id="atividadesContainer">
                <div style="text-align:center; color:#5A5E72; padding:20px;">Carregando...</div>
            </div>
        </div>
    </div>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <script>
        const API_URL = 'https://pplbase.onrender.com';
        const token = localStorage.getItem('pplbase_token');

        if (!token) window.location.href = '/';

        // ===== MENU MOBILE =====
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('open');
        });

        // ===== LOGOUT =====
        function logout() {
            localStorage.removeItem('pplbase_token');
            window.location.href = '/';
        }
        document.getElementById('btnLogoutDesktop').addEventListener('click', logout);
        document.getElementById('btnLogoutMobile').addEventListener('click', logout);

        // ===== CARREGAR DADOS =====
        async function carregarDados() {
            try {
                // Perfil
                const respPerfil = await fetch(`${API_URL}/usuarios/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const user = await respPerfil.json();
                document.getElementById('userName').textContent = user.nome || 'Usuário';

                // Seguidores/Seguindo
                const respSeguidores = await fetch(`${API_URL}/conexoes/seguidores`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const seguidores = await respSeguidores.json();

                const respSeguindo = await fetch(`${API_URL}/conexoes/seguindo`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const seguindo = await respSeguindo.json();

                document.getElementById('statSeguidores').textContent = seguidores.length;
                document.getElementById('statSeguindo').textContent = seguindo.length;
                document.getElementById('statHabilidades').textContent = user.habilidades?.length || 0;
                document.getElementById('statExperiencias').textContent = user.experiencias?.length || 0;

                // Sugestões
                const respBusca = await fetch(`${API_URL}/pesquisa/pessoas?limit=5`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const pessoas = await respBusca.json();
                const seguindoUsernames = seguindo.map(u => u.username);
                const sugestoes = pessoas.filter(p => 
                    p.username !== user.username && 
                    !seguindoUsernames.includes(p.username)
                );

                const sugestoesContainer = document.getElementById('sugestoesContainer');
                if (sugestoes.length === 0) {
                    sugestoesContainer.innerHTML = '<div style="text-align:center; color:#5A5E72; padding:20px;">Nenhuma sugestão no momento.</div>';
                } else {
                    sugestoesContainer.innerHTML = sugestoes.map(p => `
                        <div class="sugestao-item">
                            <div class="info">
                                <div class="avatar">${p.nome?.charAt(0) || '?'}</div>
                                <div>
                                    <div class="nome">${p.nome || 'Usuário'}</div>
                                    <div class="username">@${p.username}</div>
                                </div>
                            </div>
                            <button class="btn-seguir" onclick="seguirUsuario('${p.username}')">Seguir</button>
                        </div>
                    `).join('');
                }

                // Atividades
                const atividadesContainer = document.getElementById('atividadesContainer');
                if (pessoas.length === 0) {
                    atividadesContainer.innerHTML = '<div style="text-align:center; color:#5A5E72; padding:20px;">Nenhuma atividade recente.</div>';
                } else {
                    atividadesContainer.innerHTML = pessoas.slice(0, 5).map(p => `
                        <div class="atividade-item">
                            <div class="icon">👤</div>
                            <div class="text">
                                <strong>${p.nome || 'Usuário'}</strong> 
                                ${p.bio ? `— ${p.bio}` : 'entrou no PplBase!'}
                            </div>
                        </div>
                    `).join('');
                }

            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function seguirUsuario(username) {
            try {
                const response = await fetch(`${API_URL}/conexoes/seguir/${username}`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    alert(`✅ Você agora segue @${username}`);
                    carregarDados();
                } else {
                    const data = await response.json();
                    alert(`❌ ${data.detail}`);
                }
            } catch (error) {
                alert('❌ Erro ao seguir usuário');
            }
        }

        carregarDados();
    </script>

</body>
</html>
