<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PplBase - Conectando Talentos</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <button class="btn btn-primary" id="btnAbrirModal">Entrar</button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Conecte-se com <span class="highlight">pessoas incríveis</span></h1>
                <p>Encontre talentos, compartilhe habilidades e construa sua rede de contatos profissionais.</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary btn-large" id="btnHeroCadastro">Começar Agora 🚀</button>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 PplBase - Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- ===== MODAL LOGIN ===== -->
    <div class="modal" id="modalLogin">
        <div class="modal-content">
            <span class="modal-close" id="fecharModal">&times;</span>
            <div class="modal-tabs">
                <button class="tab active" data-tab="login">Entrar</button>
                <button class="tab" data-tab="cadastro">Cadastrar</button>
            </div>

            <form id="formLogin" class="modal-form active">
                <h2>Entrar no PplBase</h2>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="loginUsername" placeholder="Seu username" required />
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Sua senha" required />
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>

                <div style="display:flex; align-items:center; gap:16px; margin:16px 0; color:#64748B; font-size:13px;">
                    <span style="flex:1; height:1px; background:#334155;"></span>
                    ou
                    <span style="flex:1; height:1px; background:#334155;"></span>
                </div>

                <button type="button" class="btn-google" id="btnGoogleLogin">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Entrar com Google
                </button>

                <p class="form-message" id="loginMessage"></p>
            </form>

            <form id="formCadastro" class="modal-form">
                <h2>Criar conta</h2>
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="cadNome" placeholder="Seu nome" required />
                </div>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="cadUsername" placeholder="Escolha um username" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cadEmail" placeholder="seu@email.com" required />
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" required />
                </div>
                <div class="form-group">
                    <label>Localização</label>
                    <input type="text" id="cadLocalizacao" placeholder="Ex: Chimoio, Moçambique" />
                </div>
                <button type="submit" class="btn btn-primary btn-full">Criar conta</button>

                <div style="display:flex; align-items:center; gap:16px; margin:16px 0; color:#64748B; font-size:13px;">
                    <span style="flex:1; height:1px; background:#334155;"></span>
                    ou
                    <span style="flex:1; height:1px; background:#334155;"></span>
                </div>

                <button type="button" class="btn-google" id="btnGoogleCadastro">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Criar conta com Google
                </button>

                <p class="form-message" id="cadastroMessage"></p>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalLogin');
        const btnAbrirModal = document.getElementById('btnAbrirModal');
        const btnHeroCadastro = document.getElementById('btnHeroCadastro');
        const btnFecharModal = document.getElementById('fecharModal');
        const tabs = document.querySelectorAll('.tab');
        const formLogin = document.getElementById('formLogin');
        const formCadastro = document.getElementById('formCadastro');

        function abrirModal(tab = 'login') {
            modal.classList.add('active');
            tabs.forEach(t => t.classList.remove('active'));
            const tabAtiva = document.querySelector(`.tab[data-tab="${tab}"]`);
            if (tabAtiva) tabAtiva.classList.add('active');
            formLogin.classList.remove('active');
            formCadastro.classList.remove('active');
            if (tab === 'login') formLogin.classList.add('active');
            else formCadastro.classList.add('active');
        }

        function fecharModal() {
            modal.classList.remove('active');
        }

        btnAbrirModal.addEventListener('click', () => abrirModal('login'));
        btnHeroCadastro.addEventListener('click', () => abrirModal('cadastro'));
        btnFecharModal.addEventListener('click', fecharModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                formLogin.classList.remove('active');
                formCadastro.classList.remove('active');
                if (target === 'login') formLogin.classList.add('active');
                else formCadastro.classList.add('active');
            });
        });

        function mostrarMensagem(el, msg, tipo = 'error') {
            el.textContent = msg;
            el.className = `form-message ${tipo}`;
        }

        function salvarToken(token) {
            localStorage.setItem('pplbase_token', token);
        }

        const API_URL = 'https://pplbase.onrender.com';

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername');
            const senha = document.getElementById('loginSenha');
            const message = document.getElementById('loginMessage');
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username.value, senha: senha.value })
                });
                const data = await response.json();
                if (response.ok) {
                    salvarToken(data.access_token);
                    mostrarMensagem(message, '✅ Login realizado!', 'success');
                    setTimeout(() => { fecharModal(); window.location.href = '/inicio.html'; }, 1000);
                } else {
                    mostrarMensagem(message, data.detail || '❌ Erro ao fazer login');
                }
            } catch (error) {
                mostrarMensagem(message, '❌ Erro de conexão com o servidor');
            }
        });

        formCadastro.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cadNome');
            const username = document.getElementById('cadUsername');
            const email = document.getElementById('cadEmail');
            const senha = document.getElementById('cadSenha');
            const localizacao = document.getElementById('cadLocalizacao');
            const message = document.getElementById('cadastroMessage');

            if (senha.value.length < 6) {
                mostrarMensagem(message, '❌ Senha deve ter mínimo 6 caracteres');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: nome.value,
                        username: username.value,
                        email: email.value,
                        senha: senha.value,
                        localizacao: localizacao.value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    salvarToken(data.access_token);
                    mostrarMensagem(message, '✅ Conta criada!', 'success');
                    setTimeout(() => { fecharModal(); window.location.href = '/inicio.html'; }, 1500);
                } else {
                    mostrarMensagem(message, data.detail || '❌ Erro ao criar conta');
                }
            } catch (error) {
                mostrarMensagem(message, '❌ Erro de conexão com o servidor');
            }
        });

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            alert('🚧 Login com Google em breve!');
        });

        document.getElementById('btnGoogleCadastro').addEventListener('click', () => {
            alert('🚧 Cadastro com Google em breve!');
        });
    </script>

</body>
</html>
