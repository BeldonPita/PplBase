<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PplBase - Conectando Talentos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">Início</a>
                <a href="busca.html">Buscar</a>
                <button class="btn btn-primary" id="btnAbrirModal">Entrar</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <div>
                <h1>Conecte-se com <span class="highlight">pessoas incríveis</span></h1>
                <p>Encontre talentos, compartilhe habilidades e construa sua rede profissional.</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary" id="btnHeroCadastro">Começar</button>
                    <button class="btn btn-outline">Saiba mais</button>
                </div>
                <div class="hero-stats">
                    <div><div class="stat-number">1.200+</div><div class="stat-label">Profissionais</div></div>
                    <div><div class="stat-number">300+</div><div class="stat-label">Empresas</div></div>
                    <div><div class="stat-number">95%</div><div class="stat-label">Satisfação</div></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; align-items:center;">
                <div style="width:280px; height:280px;">
                    <svg viewBox="0 0 100 100" style="width:100%; height:100%; animation: girarLogo 12s linear infinite;">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.3" />
                        <circle cx="50" cy="50" r="32" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 12" />
                        <circle cx="50" cy="5" r="5" fill="#8B5CF6" />
                        <circle cx="50" cy="95" r="5" fill="#8B5CF6" />
                        <circle cx="5" cy="50" r="5" fill="#8B5CF6" />
                        <circle cx="95" cy="50" r="5" fill="#8B5CF6" />
                        <circle cx="50" cy="50" r="16" fill="#8B5CF6" opacity="0.15" />
                        <text x="50" y="56" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" font-family="Inter">P</text>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <!-- MODAL LOGIN/CADASTRO (COM GOOGLE E OLHO SVG) -->
    <div class="modal" id="modalLogin">
        <div class="modal-content">
            <button class="modal-close" id="fecharModal">&times;</button>
            <div class="modal-tabs">
                <button class="tab active" data-tab="login">Entrar</button>
                <button class="tab" data-tab="cadastro">Cadastrar</button>
            </div>

            <form id="formLogin" class="modal-form active">
                <h2>Entrar no PplBase</h2>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="loginUsername" placeholder="Seu username" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginSenha" placeholder="Sua senha" required>
                        <button type="button" class="toggle-password" onclick="toggleSenha('loginSenha', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                <div style="display:flex; align-items:center; gap:16px; margin:16px 0; color:var(--text-muted); font-size:13px;">
                    <span style="flex:1; height:1px; background:var(--border-color);"></span>
                    ou
                    <span style="flex:1; height:1px; background:var(--border-color);"></span>
                </div>
                <button type="button" class="btn-google" id="btnGoogleLogin">
                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Entrar com Google
                </button>
                <p class="form-message" id="loginMessage"></p>
            </form>

            <form id="formCadastro" class="modal-form">
                <h2>Criar sua conta</h2>
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="cadNome" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="cadUsername" placeholder="Escolha um username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cadEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="toggle-password" onclick="toggleSenha('cadSenha', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
                <div style="display:flex; align-items:center; gap:16px; margin:16px 0; color:var(--text-muted); font-size:13px;">
                    <span style="flex:1; height:1px; background:var(--border-color);"></span>
                    ou
                    <span style="flex:1; height:1px; background:var(--border-color);"></span>
                </div>
                <button type="button" class="btn-google" id="btnGoogleCadastro">
                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Criar conta com Google
                </button>
                <p class="form-message" id="cadastroMessage"></p>
            </form>
        </div>
    </div>

    <script>
        function toggleSenha(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
