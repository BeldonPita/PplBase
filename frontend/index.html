<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PplBase - Conectando Talentos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-avatar">
                    <svg class="logo-svg" viewBox="0 0 100 100">
                        <circle class="logo-ring" cx="50" cy="50" r="42" />
                        <circle class="logo-ring logo-ring-2" cx="50" cy="50" r="30" />
                        <circle class="logo-dot" cx="50" cy="8" r="4" />
                        <circle class="logo-dot" cx="50" cy="92" r="4" />
                        <circle class="logo-dot" cx="8" cy="50" r="4" />
                        <circle class="logo-dot" cx="92" cy="50" r="4" />
                        <text class="logo-letter" x="50" y="58" text-anchor="middle">P</text>
                    </svg>
                </div>
                <span class="logo-text">Ppl<span class="highlight">Base</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">Início</a>
                <button class="btn btn-primary" id="btnAbrirModal">Entrar</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <div>
                <h1>Conecte-se com <span class="highlight">pessoas incríveis</span></h1>
                <p>Encontre talentos, compartilhe habilidades e construa sua rede profissional.</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary" id="btnHeroCadastro">Começar</button>
                    <button class="btn btn-outline">Saiba mais</button>
                </div>
                <div class="hero-stats">
                    <div><div class="stat-number">1.200+</div><div class="stat-label">Profissionais</div></div>
                    <div><div class="stat-number">300+</div><div class="stat-label">Empresas</div></div>
                    <div><div class="stat-number">95%</div><div class="stat-label">Satisfação</div></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; align-items:center;">
                <div style="width:280px; height:280px;">
                    <svg viewBox="0 0 100 100" style="width:100%; height:100%; animation: girarLogo 12s linear infinite;">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.3" />
                        <circle cx="50" cy="50" r="32" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 12" />
                        <circle cx="50" cy="5" r="5" fill="#8B5CF6" />
                        <circle cx="50" cy="95" r="5" fill="#8B5CF6" />
                        <circle cx="5" cy="50" r="5" fill="#8B5CF6" />
                        <circle cx="95" cy="50" r="5" fill="#8B5CF6" />
                        <circle cx="50" cy="50" r="16" fill="#8B5CF6" opacity="0.15" />
                        <text x="50" y="56" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" font-family="Inter">P</text>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer><div class="container"><p>&copy; 2026 PplBase</p></div></footer>

    <!-- MODAL LOGIN/CADASTRO -->
    <div class="modal" id="modalLogin">
        <div class="modal-content">
            <button class="modal-close" id="fecharModal">&times;</button>
            <div class="modal-tabs">
                <button class="tab active" data-tab="login">Entrar</button>
                <button class="tab" data-tab="cadastro">Cadastrar</button>
            </div>
            <form id="formLogin" class="modal-form active">
                <h2>Entrar no PplBase</h2>
                <div class="form-group"><label>Usuário</label><input type="text" id="loginUsername" placeholder="Seu username" required></div>
                <div class="form-group"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha" required></div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                <p class="form-message" id="loginMessage"></p>
            </form>
            <form id="formCadastro" class="modal-form">
                <h2>Criar sua conta</h2>
                <div class="form-group"><label>Nome</label><input type="text" id="cadNome" placeholder="Seu nome" required></div>
                <div class="form-group"><label>Usuário</label><input type="text" id="cadUsername" placeholder="Escolha um username" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="cadEmail" placeholder="seu@email.com" required></div>
                <div class="form-group"><label>Senha</label><input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" required></div>
                <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
                <p class="form-message" id="cadastroMessage"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
